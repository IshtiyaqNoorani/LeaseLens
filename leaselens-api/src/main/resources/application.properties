spring.application.name=leaselens-api
server.port=${PORT:8090}
leaselens.version=@project.version@
# RFC 7807 problem details for framework errors (404, 405, type mismatch, ...)
spring.mvc.problemdetails.enabled=true
# CSV uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=60MB
# Dates in JSON as ISO strings (2026-03-31), not arrays
spring.jackson.serialization.write-dates-as-timestamps=false

# Load the bundled sample dataset on start-up
leaselens.autoload-sample=true
# Rule-based attention list (transparent thresholds, shown with each flag)
leaselens.attention.collection-efficiency-below-pct=90
leaselens.attention.occupancy-below-pct=75
leaselens.attention.expense-ratio-above-pct=45
leaselens.attention.overdue-days=90
leaselens.attention.overdue-share-above-pct=1.0
